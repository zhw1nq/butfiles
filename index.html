<!DOCTYPE html>
<html lang="vi" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#f8f9fc">
    <meta name="description" content="The Bụt File - 5 điều bí mật của Bụt.">

    <title>The Bụt File</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <style>
        :root {
            --accent: #f04483;
            --accent-hover: #db326f;
            --page-bg: #f8f9fc;
            --card-bg: #ffffff;
            --card-border: #ececf1;
            --text-main: #252631;
            --text-muted: #777987;
            --surface-bg: #f7f7fa;
            --shadow: 0 8px 35px rgba(20, 20, 40, 0.045);
        }

        [data-bs-theme="dark"] {
            --page-bg: #111216;
            --card-bg: #1a1b21;
            --card-border: #2b2c33;
            --text-main: #f1f1f5;
            --text-muted: #a2a3af;
            --surface-bg: #15161b;
            --shadow: 0 8px 35px rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            background: var(--page-bg);
            color: var(--text-main);
            font-family:
                -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.2s ease,
                        color 0.2s ease;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* Header */

        .topbar {
            width: 100%;
            padding: 18px 24px;
        }

        .topbar-inner {
            width: 100%;
            max-width: 1040px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            flex: 0 0 36px;
            display: grid;
            place-items: center;
            border: 1px solid var(--card-border);
            border-radius: 11px;
            background: var(--card-bg);
            color: var(--accent);
            font-size: 17px;
        }

        .theme-toggle {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            display: grid;
            place-items: center;
            border: 1px solid var(--card-border);
            border-radius: 50%;
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 17px;
            cursor: pointer;
            transition: background 0.2s ease,
                        transform 0.2s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
        }

        .theme-toggle:focus-visible,
        .btn:focus-visible {
            outline: 3px solid rgba(240, 68, 131, 0.35);
            outline-offset: 3px;
        }

        /* Main */

        .main-content {
            min-height: calc(100vh - 125px);
            min-height: calc(100dvh - 125px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 45px;
        }

        .notice-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            background: var(--card-bg);
            box-shadow: var(--shadow);
        }

        .illustration {
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border-radius: 17px;
            background: rgba(240, 68, 131, 0.09);
            color: var(--accent);
            font-size: 26px;
        }

        .notice-title {
            margin: 0 0 12px;
            font-size: 25px;
            line-height: 1.3;
            font-weight: 750;
            letter-spacing: -0.65px;
            text-align: center;
        }

        .notice-description {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.8;
            text-align: center;
            overflow-wrap: anywhere;
        }

        /* File information */

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 24px;
            padding: 15px;
            border: 1px solid var(--card-border);
            border-radius: 13px;
            background: var(--surface-bg);
        }

        .file-info-icon {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: rgba(240, 68, 131, 0.09);
            color: var(--accent);
            font-size: 21px;
        }

        .file-info-content {
            min-width: 0;
            flex: 1;
        }

        .file-info-title {
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: 650;
            overflow-wrap: anywhere;
        }

        .file-info-subtitle {
            margin: 0;
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .file-info-status {
            flex: 0 0 auto;
            color: var(--text-muted);
            font-size: 17px;
        }

        /* Actions */

        .actions {
            display: grid;
            gap: 10px;
            margin-top: 22px;
        }

        .btn {
            min-height: 48px;
            padding: 12px 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 650;
            line-height: 1.4;
            white-space: normal;
            transition: background 0.2s ease,
                        border-color 0.2s ease,
                        transform 0.2s ease;
        }

        .btn-primary-custom {
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .btn-primary-custom:hover {
            border-color: var(--accent-hover);
            background: var(--accent-hover);
            color: #fff;
        }

        .btn-secondary-custom {
            border: 1px solid var(--card-border);
            background: transparent;
            color: var(--text-main);
        }

        .btn-secondary-custom:hover {
            border-color: var(--card-border);
            background: var(--surface-bg);
            color: var(--text-main);
        }

        .privacy-note {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 6px;
            margin: 20px 0 0;
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.7;
            text-align: center;
        }

        .privacy-note i {
            margin-top: 2px;
            flex: 0 0 auto;
        }

        /* Footer */

        .footer {
            padding: 0 20px 20px;
            color: var(--text-muted);
            font-size: 11px;
            text-align: center;
        }

        /* Troll screen */

        #troll {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #ff0033;
            animation: bgflash 0.5s linear infinite;
            user-select: none;
            -webkit-user-select: none;
        }

        @keyframes bgflash {
            0%   { background: #ff0033; }
            33%  { background: #ffee00; }
            66%  { background: #00e5ff; }
            100% { background: #ff0033; }
        }

        /* Ảnh nền stretch full màn hình */
        .bg-fill {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            object-fit: fill; /* kéo giãn ảnh phủ kín toàn màn hình */
            pointer-events: none;
            user-select: none;
        }

        #stage {
            position: absolute;
            inset: 0;
            z-index: 1;
            animation: shake 0.18s linear infinite;
        }

        @keyframes shake {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(-6px, 4px); }
            50%  { transform: translate(5px, -5px); }
            75%  { transform: translate(-4px, -3px); }
            100% { transform: translate(0, 0); }
        }


        .rain {
            position: absolute;
            top: -60px;
            pointer-events: none;
            animation: fall var(--t, 2.5s) linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(115vh) rotate(540deg); }
        }

        .troll-center {
            position: absolute;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            text-align: center;
            pointer-events: none;
            width: max-content;
            max-width: 88vw;
            animation: flyAround 6s ease-in-out infinite;
        }

        @keyframes flyAround {
            0% {
                top: 45%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(0deg);
            }
            18% {
                top: 25%;
                left: 32%;
                transform: translate(-50%, -50%) rotate(-6deg) scale(0.95);
            }
            36% {
                top: 65%;
                left: 30%;
                transform: translate(-50%, -50%) rotate(5deg) scale(1.04);
            }
            54% {
                top: 30%;
                left: 68%;
                transform: translate(-50%, -50%) rotate(-4deg) scale(0.96);
            }
            72% {
                top: 70%;
                left: 65%;
                transform: translate(-50%, -50%) rotate(6deg) scale(1.02);
            }
            90% {
                top: 38%;
                left: 45%;
                transform: translate(-50%, -50%) rotate(-5deg) scale(0.97);
            }
            100% {
                top: 45%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(0deg);
            }
        }

        .troll-headline {
            max-width: 88vw;
            margin: 0;
            color: #fff;
            font-family: Impact, "Arial Black", sans-serif;
            font-size: clamp(16px, 3.2vw, 32px);
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            -webkit-text-stroke: 1.5px #000;
            paint-order: stroke fill;
            text-shadow: 3px 3px 0 #000, -2px -2px 0 #f04483;
            animation: pulse 0.35s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(0.95) rotate(-1.5deg); }
            to   { transform: scale(1.05) rotate(1.5deg); }
        }

        .troll-counter {
            padding: 3px 10px;
            border: 2px solid #000;
            border-radius: 6px;
            background: #fff;
            color: #d00000;
            font-family: Impact, "Arial Black", sans-serif;
            font-size: clamp(11px, 1.8vw, 15px);
            transform: rotate(-3deg);
        }

        .troll-sub {
            padding: 3px 8px;
            border-radius: 5px;
            background: #000;
            color: #ffee00;
            font-size: clamp(10px, 1.4vw, 13px);
            font-weight: 800;
            transform: rotate(2deg);
        }

        .troll-banner {
            position: absolute;
            left: 0;
            right: 0;
            z-index: 6;
            overflow: hidden;
            padding: 6px 0;
            background: #000;
            color: #ffee00;
            font-family: Impact, "Arial Black", sans-serif;
            font-size: clamp(16px, 3.5vw, 28px);
            white-space: nowrap;
            pointer-events: none;
        }

        .troll-banner.top    { top: 0; }
        .troll-banner.bottom { bottom: 0; color: #ff3b6b; }

        .troll-banner span {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 12s linear infinite;
        }

        .troll-banner.bottom span {
            animation-direction: reverse;
        }

        @keyframes marquee {
            to { transform: translateX(-100%); }
        }

        .troll-exit {
            position: absolute;
            top: 46px;
            right: 10px;
            z-index: 10;
            padding: 6px 12px;
            border: 2px solid #000;
            border-radius: 8px;
            background: #fff;
            color: #000;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        @media (prefers-reduced-motion: reduce) {
            #stage,
            .troll-headline,
            .troll-center {
                animation: none;
            }
        }

        /* Mobile */

        @media (max-width: 575.98px) {
            .topbar {
                padding: 14px 16px;
            }

            .brand {
                gap: 8px;
                font-size: 12px;
            }

            .brand-icon {
                width: 34px;
                height: 34px;
                flex-basis: 34px;
            }

            .theme-toggle {
                width: 40px;
                height: 40px;
                flex-basis: 40px;
            }

            .main-content {
                min-height: auto;
                min-height: calc(100dvh - 100px);
                padding: 24px 16px 32px;
            }

            .notice-card {
                max-width: 420px;
                padding: 27px 21px;
                border-radius: 17px;
            }

            .illustration {
                width: 54px;
                height: 54px;
                margin-bottom: 18px;
                border-radius: 15px;
                font-size: 24px;
            }

            .notice-title {
                font-size: 23px;
            }

            .notice-description {
                font-size: 13px;
                line-height: 1.8;
            }

            .file-info {
                margin-top: 21px;
                padding: 13px;
            }

            .btn {
                min-height: 48px;
                font-size: 13px;
            }

            .privacy-note {
                font-size: 10px;
            }
        }

        @media (max-width: 360px) {
            .notice-card {
                padding: 23px 17px;
            }

            .notice-title {
                font-size: 21px;
            }

            .file-info {
                gap: 9px;
            }

            .file-info-title {
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <span class="brand-icon">
                    <i class="bi bi-folder2-open"></i>
                </span>

                <span>MY FILES</span>
            </div>

            <button
                type="button"
                class="theme-toggle"
                id="themeToggle"
                aria-label="Chuyển sang Dark Mode"
                title="Chuyển giao diện"
            >
                <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <!-- Main content -->
    <main class="main-content" id="gate">
        <section class="notice-card" aria-labelledby="noticeTitle">

            <div class="illustration">
                <i class="bi bi-file-earmark-text"></i>
            </div>

            <h1 class="notice-title" id="noticeTitle">
                Một chút lưu ý
            </h1>

            <p class="notice-description">
                File này chứa 5 điều bí mật của Bụt. Vui lòng giữ bí mật
                và đừng tiết lộ cho ai biết nhé.
            </p>

            <!-- File preview -->
            <div class="file-info">
                <div class="file-info-icon">
                    <i class="bi bi-file-earmark"></i>
                </div>

                <div class="file-info-content">
                    <div class="file-info-title">
                        but.pdf
                    </div>

                    <p class="file-info-subtitle">
                        5 điều bí mật của Bụt
                    </p>
                </div>

                <i class="bi bi-info-circle file-info-status"
                   aria-hidden="true"></i>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button
                    type="button"
                    class="btn btn-primary-custom"
                    id="yesButton"
                >
                    <i class="bi bi-check-circle"></i>
                    Tôi hứa giữ bí mật
                </button>

                <button
                    type="button"
                    class="btn btn-secondary-custom"
                    id="noButton"
                >
                    Để sau
                </button>
            </div>

            <p class="privacy-note">
                <i class="bi bi-shield-check"></i>
                <span>
                    Bụt sẽ buồn nếu bí mật bị tiết lộ.
                </span>
            </p>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer" id="pageFooter">
        VHMING.COM &copy; <span id="year"></span>
    </footer>

    <!-- Troll screen -->
    <div id="troll" aria-hidden="true">
        <img class="bg-fill" src="./image.png" alt="">
        <div id="stage"></div>

        <div class="troll-banner top">
            <span id="bannerTop"></span>
        </div>

        <div class="troll-center">
            <h2 class="troll-headline" id="headline">🚨 TIN SỐC ĐỘNG TRỜI 😱</h2>
            <div class="troll-counter" id="counter">999.999.900 người đang hóng biến</div>
            <div class="troll-sub" id="sub">Vén màn bí mật chấn động thế kỷ!</div>
        </div>

        <div class="troll-banner bottom">
            <span id="bannerBottom"></span>
        </div>
    </div>

    <!-- Âm thanh lặp -->
    <audio id="alertSound" src="./alert.mp3" loop preload="auto"></audio>

    <!-- Notification -->
    <div
        class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3"
        style="z-index: 2000; width: min(100%, 420px);"
    >
        <div
            id="noticeToast"
            class="toast border-0 rounded-3 w-100"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        >
            <div class="toast-body p-3" id="noticeMessage"></div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const root = document.documentElement;

        const themeToggle = document.getElementById("themeToggle");
        const themeIcon = document.getElementById("themeIcon");

        const gate = document.getElementById("gate");
        const pageFooter = document.getElementById("pageFooter");
        const troll = document.getElementById("troll");
        const stage = document.getElementById("stage");
        const headline = document.getElementById("headline");
        const counter = document.getElementById("counter");
        const sub = document.getElementById("sub");
        const alertSound = document.getElementById("alertSound");
        const exitButton = document.getElementById("exitButton");

        const yesButton = document.getElementById("yesButton");
        const noButton = document.getElementById("noButton");

        const toastElement = document.getElementById("noticeToast");
        const noticeMessage = document.getElementById("noticeMessage");

        const toast = new bootstrap.Toast(toastElement, {
            delay: 3000
        });

        document.getElementById("year").textContent =
            new Date().getFullYear();

        // Light / Dark Mode
        function setTheme(theme) {
            root.setAttribute("data-bs-theme", theme);

            const isDark = theme === "dark";

            themeIcon.className = isDark
                ? "bi bi-sun-fill"
                : "bi bi-moon-stars-fill";

            themeToggle.setAttribute(
                "aria-label",
                isDark
                    ? "Chuyển sang Light Mode"
                    : "Chuyển sang Dark Mode"
            );

            document
                .querySelector('meta[name="theme-color"]')
                .setAttribute(
                    "content",
                    isDark ? "#111216" : "#f8f9fc"
                );
        }

        function getInitialTheme() {
            try {
                const savedTheme = localStorage.getItem("site-theme");

                if (savedTheme === "light" || savedTheme === "dark") {
                    return savedTheme;
                }
            } catch (error) {
                // Tiếp tục bằng theme hệ thống nếu storage bị chặn.
            }

            return window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches ? "dark" : "light";
        }

        setTheme(getInitialTheme());

        themeToggle.addEventListener("click", () => {
            const currentTheme =
                root.getAttribute("data-bs-theme");

            const nextTheme =
                currentTheme === "dark" ? "light" : "dark";

            setTheme(nextTheme);

            try {
                localStorage.setItem("site-theme", nextTheme);
            } catch (error) {
                // Nút chuyển theme vẫn hoạt động bình thường.
            }
        });

        // Toast notification
        function showNotice(message) {
            noticeMessage.textContent = message;
            toast.show();
        }

        // ===== Troll mode =====
        const HEADLINES = [
            "🚨 BẬT MÍ BÍ MẬT ĐỘNG TRỜI CỦA BỤT! 😱",
            "🔥 SỐC TẬN ÓC: BỤT BỊ BẮT QUẢ TANG! 🚨",
            "⚡ KHÔNG THỂ TIN NỔI: SỰ THẬT KINH HOÀNG VỀ BỤT! 💀",
            "💥 BỤT CHÍNH THỨC LÊN TIẾNG SAU BÊ BỐI THẾ KỶ! 🤯",
            "🚨 CHẤN ĐỘNG CẢ NƯỚC: BỤT ĐÃ BỊ PHƠI BÀY! 🤡",
            "⚡ TUYÊN BỐ GÂY SỐC KHIẾN HÀNG TRIỆU NGƯỜI BẬT KHÓC! 😭",
            "🔥 TIN NÓNG 24H: VÉN MÀN BÍ MẬT KINH ĐIỂN! 💣",
            "😱 CẢ THẾ GIỚI BÀNG HOÀNG TRƯỚC SỰ THẬT NÀY! 🚨"
        ];

        const SUBS = [
            "CĐM đang ráo riết truy lùng danh tính Bụt! 🕵️‍♂️",
            "Xem ngay trước khi clip bị xoá vĩnh viễn! 🔞",
            "Chính thức: Không thể che giấu được nữa rồi! 😱",
            "Các chuyên gia hàng đầu cũng phải lắc đầu ngao ngán! 🤦‍♂️",
            "Share gấp cho 10 người bạn kẻo bị phong sát! 🚨",
            "Bí mật chấn động tam giới vừa bị rò rỉ đêm qua! 🔥",
            "Cảnh báo: Người yếu tim tuyệt đối không nên xem! ⚠️",
            "Sự thật ngã ngửa khiến hàng triệu người ngất lịm! 💀"
        ];

        const EMOJIS = ["🤡", "😂", "💀", "🔥", "😱", "🤣", "👀", "💸", "🚨"];

        const BANNER_TEXT =
            "🚨 TIN NÓNG ĐỘNG TRỜI 🚨 BẬT MÍ BÍ MẬT KINH HOÀNG 🚨 " +
            "HÀNG TRIỆU NGƯỜI BÀNG HOÀNG 🚨 CHẤN ĐỘNG KHÔNG THỂ TIN NỔI 🚨 ";

        document.getElementById("bannerTop").textContent =
            BANNER_TEXT.repeat(3);
        document.getElementById("bannerBottom").textContent =
            BANNER_TEXT.repeat(3);

        let timers = [];
        let victims = 999999900;

        const bgFill = document.querySelector(".bg-fill");
        if (bgFill) {
            bgFill.addEventListener("error", () => {
                showNotice("Không tải được image.png. Hãy kiểm tra file.");
            });
        }

        function rand(min, max) {
            return min + Math.random() * (max - min);
        }

        function spawnRain() {
            const el = document.createElement("span");

            el.className = "rain";
            el.textContent =
                EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
            el.style.left = rand(0, 96) + "vw";
            el.style.fontSize = rand(24, 64) + "px";
            el.style.setProperty("--t", rand(1.6, 3.2) + "s");

            stage.appendChild(el);
            setTimeout(() => el.remove(), 3400);
        }

        function burstRain(n) {
            for (let i = 0; i < n; i++) {
                spawnRain();
            }
        }

        function pick(list) {
            return list[Math.floor(Math.random() * list.length)];
        }

        function updateCounter() {
            victims += Math.floor(rand(1, 12));
            counter.textContent =
                victims.toLocaleString("vi-VN") + " người đang hóng biến";
        }

        function startTroll() {
            gate.style.display = "none";
            pageFooter.style.display = "none";
            troll.style.display = "block";
            troll.setAttribute("aria-hidden", "false");

            headline.textContent = pick(HEADLINES);
            sub.textContent = pick(SUBS);

            if (troll.requestFullscreen) {
                troll.requestFullscreen().catch(() => {});
            }

            alertSound.currentTime = 0;
            alertSound.play().catch(() => {
                showNotice(
                    "Không phát được âm thanh. Hãy kiểm tra file alert.mp3."
                );
            });

            victims = 999999900;
            burstRain(15);
            updateCounter();

            timers.push(setInterval(spawnRain, 150));
            timers.push(setInterval(updateCounter, 90));
            timers.push(setInterval(() => {
                headline.textContent = pick(HEADLINES);
                sub.textContent = pick(SUBS);
            }, 1200));
        }

        function stopTroll() {
            timers.forEach(clearInterval);
            timers = [];

            alertSound.pause();
            alertSound.currentTime = 0;

            stage.innerHTML = "";

            troll.style.display = "none";
            troll.setAttribute("aria-hidden", "true");
            gate.style.display = "";
            pageFooter.style.display = "";

            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
        }

        yesButton.addEventListener("click", startTroll);
        noButton.addEventListener("click", startTroll);
        exitButton.addEventListener("click", stopTroll);

        // Chạm vào màn hình để rơi thêm emoji
        stage.addEventListener("pointerdown", () => burstRain(5));

        // Thoát fullscreen (Esc) thì dừng luôn
        document.addEventListener("fullscreenchange", () => {
            if (
                !document.fullscreenElement &&
                troll.style.display === "block"
            ) {
                stopTroll();
            }
        });

        // Lỗi file âm thanh
        alertSound.addEventListener("error", () => {
            if (troll.style.display === "block") {
                showNotice("Không thể tải alert.mp3. Hãy kiểm tra file.");
            }
        });
    </script>
</body>
</html>
